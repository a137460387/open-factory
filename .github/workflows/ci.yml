name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect code vs docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'examples/**'
              - 'scripts/**'
              - 'tools/**'
              - 'ltx-video-service/**'
              - '.github/**'
              - '.superpowers/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - 'eslint.config.mjs'
              - 'knip.json'
              - 'budget.json'
              - 'typedoc.json'
              - '.dependency-cruiser.cjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.gitignore'

  frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: changes
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change - skipping frontend checks"

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun install --frozen-lockfile

      - name: Audit npm dependencies
        if: needs.changes.outputs.code == 'true'
        run: bun audit --audit-level=high

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: bun run typecheck

      - name: Test with coverage
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun run test

      - name: Upload coverage report
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # 静态质量门禁：格式、lint 基线棘轮、依赖循环规则。
  # 与 frontend/rust/e2e 并行，不构建不跑测试，快速反馈。
  quality-gates:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: changes
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change - skipping quality gates"

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun install --frozen-lockfile

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: bun run format:check

      - name: Lint (baseline ratchet, no new warnings)
        if: needs.changes.outputs.code == 'true'
        run: bun run lint:ci

      - name: Dependency rules (no cycles)
        if: needs.changes.outputs.code == 'true'
        run: bun run depcruise:ci

  rust:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: changes
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change - skipping rust checks"
        working-directory: .

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: cd "$GITHUB_WORKSPACE" && bun install --frozen-lockfile

      - name: Build frontend
        if: needs.changes.outputs.code == 'true'
        run: bun run build
        working-directory: .

      - name: Check bundle size
        if: needs.changes.outputs.code == 'true'
        run: bun run check:bundle
        working-directory: .

      - name: Install Rust stable
        if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install system dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install cargo-audit
        if: needs.changes.outputs.code == 'true'
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Build
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: cd "$GITHUB_WORKSPACE/apps/desktop/src-tauri" && cargo build

      - name: Test
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: cd "$GITHUB_WORKSPACE/apps/desktop/src-tauri" && cargo test

      - name: Audit
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: cd "$GITHUB_WORKSPACE/apps/desktop/src-tauri" && cargo audit

      - name: Upload test results
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: apps/desktop/src-tauri/target/nextest/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: changes
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change - skipping e2e checks"

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: needs.changes.outputs.code == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install ffmpeg
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build workspace packages
        if: needs.changes.outputs.code == 'true'
        run: bun run --filter @open-factory/editor-core --filter @open-factory/plugin-sdk build

      - name: Run E2E tests
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          # timeout 选型依据：慢 runner（noisy-neighbor，image 20260816.277.1
          # 与全绿轮相同）下单轮实测 42.9-43.8m（含失败重试），50m 余量仅 13%
          # （2026-08-23 run 32625097893 两轮 + rerun 共 4 attempt 均此量级）；
          # 60m 对慢跑常态化留约 27% 余量，保留双层重试的 infra 韧性
          timeout_minutes: 60
          command: cd "$GITHUB_WORKSPACE/apps/desktop" && bunx playwright test --workers=2 --reporter=list,html

      - name: Upload test report
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  # 生产产物冒烟（v4.78.0 启动黑屏事故的核心基建产出）：
  # e2e job 跑 dev server（无生产分块），无法拦截 vendor/editor-core
  # manualChunks 循环求值导致的生产启动崩溃。本 job 构建生产产物并经
  # vite preview + 无头 Chromium 断言 React 完成挂载（#root 非空）且
  # 模块求值期零未捕获异常，与 e2e 并行执行。
  prod-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: changes
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change - skipping production bundle smoke"

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        if: needs.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: needs.changes.outputs.code == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Build production bundle
        if: needs.changes.outputs.code == 'true'
        run: bun run build

      - name: Run production bundle smoke
        if: needs.changes.outputs.code == 'true'
        run: cd apps/desktop && node scripts/prod-smoke.mjs

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun >= 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit npm dependencies (high level)
        run: bun audit --audit-level=high

      - name: Audit npm dependencies (moderate level)
        run: bun audit --audit-level=moderate || true

      - name: Audit Rust dependencies (stale check)
        run: cargo audit --stale
        working-directory: apps/desktop/src-tauri

      - name: Audit Rust dependencies (full)
        run: cargo audit
        working-directory: apps/desktop/src-tauri

      - name: Check for known advisories
        run: |
          echo "## Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### npm audit" >> $GITHUB_STEP_SUMMARY
          bun audit --json 2>/dev/null | jq -r '.metadata.vulnerabilities | "| Level | Count |\n|-------|-------|\n| critical | .critical |\n| high | .high |\n| moderate | .moderate |\n| low | .low |"' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### cargo audit" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for details" >> $GITHUB_STEP_SUMMARY